<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/sidebar.css" />
    <title>Sidebar</title>
  </head>
  <body>
    <!-- SideBar -->
    <nav class="sidebar flex">
      <div class="logo-details flex">
        <div class="logo">
          <img src="./assests/Logo.png" alt="logo" />
        </div>
        <div class="cover-name"></div>
      </div>

      <div class="sidebar-items flex">
        <div class="search">
          <div class="search-icon">
            <img class="icon" src="./assests/search.svg" alt="search-icon" />
          </div>
          <span>Search</span>
        </div>
        <!-- <label for="searchbox"></label>
            <input type="text" id="searchbox"> -->
        <ul>
          <li>
            <img src="assests/Home Icon.svg" alt="" />
            <span class="link-name">Home</span>
          </li>
          <li>
            <img src="assests/Drive Icon.svg" alt="" />
            <span class="link-name">Drive</span>
          </li>
          <li>
            <img src="assests/Saved Icon.svg" alt="" />
            <span class="link-name">Saved</span>
          </li>
          <li>
            <img src="assests/Compact View Icon.svg" alt="" />
            <span class="link-name">Compact View</span>
          </li>
          <li>
            <img src="assests/Settings Icon.svg" alt="" />
            <span class="link-name">Settings</span>
          </li>
        </ul>
      </div>

      <!-- Support -->
      <div class="support">
        <img src="assests/ko-fi Icon.svg" alt="support" />
      </div>
      <div class="dots">
        <img src="./assests/Dots.svg" alt="dots" />
      </div>
    </nav>
    <div>
      <div
        class="gap-2 flex items-center justify-center bg-token-main-surface-primary text-token-text-primary h-8 w-8 border border border-token-border-light rounded-full"
      >
      </div>
    </div>
  </body>
</html>
