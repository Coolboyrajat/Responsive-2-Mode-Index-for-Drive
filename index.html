<!DOCTYPE html>

<head dir="ltr" lang="en">
   <meta charset="UTF-8">
   <link id="pagestyle" rel="stylesheet" href="styles.css">
   <!-- Boxicons CDN Link -->
   <link href='https://unpkg.com/boxicons@2.0.7/css/boxicons.min.css' rel='stylesheet'>
   <!-- FontAwesome CDN Link-->
   <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@latest/css/font-awesome.min.css">
   
   
   <link rel='stylesheet' href='https://cdn-uicons.flaticon.com/uicons-regular-rounded/css/uicons-regular-rounded.css'>
   <!--Import Flaticons.com CDN Link-->
<!--    
   <link rel="stylesheet" media="screen and (max-width: 600px)" href="smallscreen.css">
    -->
   <!-- for Small Screen ... is is also possible to do this way -->
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title> Responsive Sidebar Menu</title>
   <script type="text/javascript">
      // ===== To Toggle StyleSheet ===== 
      
   function swapStyleSheet(sheet){
      document.getElementById('pagestyle').setAttribute('href','toggle style.css');
   }
   </script>

</head>

<body>
   <div class="sidebar">
      <div class="logo-details">
         <img src="images/logo.png" alt="" />
         <div class="logo_name">Radioactive</div>
         <i class='bx bx-menu' aria-hidden="true" id="btn"></i>
      </div>
      <div class="nav-list">
         <ul>
            <li class="nav-items search">
               <i class='bx bx-search' aria-hidden="true"></i>
               <input type="text" placeholder="Search..." />
               <span class="tooltip">Search</span>
            </li>
            <li class="nav-items">
               <a href="#">
                  <i class="fi fi-rr-bank" aria-hidden="true"></i>
                  <span class="links_name">Home</span>
               </a>
               <span class="tooltip">Home</span>
            </li>
            <li class="nav-items">
               <a href="#">
                  <i onclick="viewBtnChange(this)" class='bx bx-grid-alt' aria-hidden="true"></i>
                  <span class="links_name">View</span>
               </a>
               <span class="tooltip">Small</span>
            </li>
            <li class="nav-items">
               <a href="#">
                  <i class='bx bx-chat' aria-hidden="true"></i>
                  <span class="links_name">Messages</span>
                  <i class='bx bx-info-circle' aria-hidden="true" id="infobtn"></i>
               </a>
               <span class="tooltip">Messages</span>
            </li>
            <li class="nav-items">
               <a href="#">
                  <i class='bx bx-heart' aria-hidden="true"></i>
                  <span class="links_name">Saved</span>
               </a>
               <span class="tooltip">Saved</span>
            </li>
            <li class="nav-items settings">
               <a href="#" id="showSettingMenu">
                  <i class='bx bx-cog' aria-hidden="true"></i>
                  <span class="links_name">Settings</span>
                  <i class="fi fi-rr-caret-up" id="arrow" aria-hidden="true"></i>
               </a>
               <span class="tooltip">Settings</span>
               <ul class="setting-dropdown">
                  <div class="settings-dropdown-menu">
                     <li>
                        <a href="#">
                           <i class="fa fa-television" aria-hidden="true"></i>
                           <span class="links_name">Display Long Name</span>
                        </a>
                     </li>
                     <li>
                        <a href="#">
                           <i class="fa fa-calendar-times-o" aria-hidden="true"></i>
                           <span class="links_name">Hide Modified Time</span>
                        </a>
                     </li>
                     <li>
                        <a href="#">
                           <i class="fa fa-trash-o" aria-hidden="true"></i>
                           <span class="links_name">Clear Trash</span>
                        </a>
                     </li>
                     <li>
                        <a href="#">
                           <i class='bx bx-bug' aria-hidden="true"></i>
                           <span class="links_name">Bugs</span>
                        </a>
                     </li>
                  </div>
               </ul>
            </li>
            <li class="nav-items">
               <div class="social-media">
                  <a href="#"><img src="images/telegram.svg" class="telegram-icon" alt="icon"></a>
                  <a href="#"><img src="images/github.svg" class="github-icon" alt="icon"></a>
               </div>
            </li>
         </ul>
      </div>
   </div>
   <div class="home-section">
      <svg xmlns="http://www.w3.org/2000/svg" id="sun" viewBox="0 0 448 512"><defs><style>.fa-secondary{opacity:.4}</style></defs><path class="fa-primary" d="M320 256c0 53.02-42.98 96-96 96S128 309 128 256c0-53.02 42.98-96 96-96S320 202.1 320 256z"/><path class="fa-secondary" d="M73.37 361.4c-12.51 12.51-12.5 32.76 0 45.26s32.75 12.51 45.25 0c12.51-12.51 12.5-32.76 0-45.26C106.1 348.9 85.88 348.9 73.37 361.4zM224 400c-17.67 0-32 14.31-32 32s14.33 32 32 32s32-14.31 32-32S241.7 400 224 400zM73.38 105.4c-12.5 12.5-12.51 32.75 0 45.25c12.51 12.51 32.76 12.5 45.25 0c12.5-12.5 12.51-32.75 0-45.25C106.1 92.87 85.87 92.88 73.38 105.4zM80 256c0-17.67-14.31-32-32-32s-32 14.33-32 32s14.31 32 32 32S80 273.7 80 256zM400 224c-17.69 0-32 14.33-32 32s14.31 32 32 32s32-14.33 32-32S417.7 224 400 224zM224 48c-17.67 0-32 14.31-32 32s14.33 32 32 32s32-14.31 32-32S241.7 48 224 48zM329.4 361.4c-12.5 12.5-12.51 32.75 0 45.26c12.51 12.51 32.76 12.5 45.25 0s12.51-32.75 0-45.26C362.1 348.9 341.9 348.9 329.4 361.4zM374.6 150.6c12.51-12.51 12.5-32.76 0-45.25s-32.75-12.51-45.25 0c-12.51 12.51-12.5 32.76 0 45.25C341.9 163.1 362.1 163.1 374.6 150.6z"></svg>
      <img src="images/toggle-on.svg" alt="" onclick="swapStyleSheet('toggle style.css')" class="toggle" />
      <img src="../images/default.png" alt="" class="test" />
   </div>
   <script src="scripts.js"></script>
   
</body>

</html>
