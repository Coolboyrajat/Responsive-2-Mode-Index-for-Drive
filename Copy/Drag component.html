<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="try.css">
    <style>
        .flex-container {
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.3s ease;
        }
        .flex-grow { flex-grow: 1; }
        .component {
            position: relative;
            background-color: #1E1E1E; 
            height: 72px;
        }
        .remove-icon {
            max-width: 40px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .remove-icon.visible {
            padding: 20px;
            opacity: 1;
            transition: width 0.3s ease; 
        }
        .remove-icon.visible svg {
            width: 20px;
            height: 20px;
        }
        #drag {
            width: 100%; 
            transition: width 0.3s ease; 
        }
        .thumbnail {
            max-width: 84px;
            height: 72px;
        }
        .thumb {
            background-color: #2B3139;
            border: 1px solid #000;
            border-radius: 8px;
            width: 70px;
            height: 56px;
            display: flex;
            justify-content: flex-end;
            align-items: flex-end;
            padding: 4px;
        }
        .size {
            background-color: #444F5E;
            width: 20px;
            height: 8px;
            border-radius: 2px;
        }
        .cover-title {
            padding: 10px 8px;
            height: 100%;
        }
        .file-name {
            background-color: #4D5A6A;
            border-radius: 2px;
            width: 100%;
            height: 8px;
            margin-bottom: 4px;
        }
        .file-size {
            background-color: #4D5A6A;
            border-radius: 4px;
            width: 24px;
            height: 10px;
        }
        .menu {
            width: 28px;
            height: 100%;
        }
    </style>
</head>
<body>
    <!---->
    <div class="component flex-container">
        <div class="remove-icon flex-container">
            <svg viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                <g>
                <path d="M9.99968 0.833496C8.18668 0.833496 6.4144 1.37111 4.90695 2.37836C3.3995 3.3856 2.22459 4.81724 1.53078 6.49223C0.83698 8.16722 0.655449 10.0103 1.00915 11.7885C1.36284 13.5666 2.23589 15.2 3.51787 16.482C4.79985 17.764 6.43319 18.637 8.21135 18.9907C9.98951 19.3444 11.8326 19.1629 13.5076 18.4691C15.1826 17.7753 16.6142 16.6003 17.6215 15.0929C18.6287 13.5854 19.1663 11.8132 19.1663 10.0002C19.1635 7.56989 18.1968 5.23998 16.4783 3.52152C14.7599 1.80306 12.4299 0.836363 9.99968 0.833496ZM9.99968 17.5002C8.51632 17.5002 7.06627 17.0603 5.8329 16.2362C4.59953 15.4121 3.63824 14.2407 3.07058 12.8703C2.50292 11.4998 2.3544 9.99184 2.64379 8.53699C2.93318 7.08213 3.64748 5.74576 4.69638 4.69686C5.74527 3.64797 7.08164 2.93366 8.5365 2.64427C9.99136 2.35488 11.4994 2.50341 12.8698 3.07107C14.2402 3.63872 15.4116 4.60002 16.2357 5.83339C17.0598 7.06675 17.4997 8.5168 17.4997 10.0002C17.4975 11.9886 16.7066 13.895 15.3005 15.301C13.8945 16.7071 11.9881 17.498 9.99968 17.5002Z" fill="white"/>
                <path d="M13.333 9.16699H6.66634C6.44533 9.16699 6.23337 9.25479 6.07709 9.41107C5.92081 9.56735 5.83301 9.77931 5.83301 10.0003C5.83301 10.2213 5.92081 10.4333 6.07709 10.5896C6.23337 10.7459 6.44533 10.8337 6.66634 10.8337H13.333C13.554 10.8337 13.766 10.7459 13.9223 10.5896C14.0785 10.4333 14.1663 10.2213 14.1663 10.0003C14.1663 9.77931 14.0785 9.56735 13.9223 9.41107C13.766 9.25479 13.554 9.16699 13.333 9.16699Z" fill="white"/>
                </g>
            </svg>
        </div>
        <div id="drag" class="flex-container" draggable="true">
            <div class="thumbnail flex-container">
                <div class="cover thumb">
                    <div class="size"></div>
                </div>            
            </div>
            <div class="cover-title flex-grow">
                <div class="file-name truncate-text"></div>
                <div class="file-size"></div>
            </div>
        </div>
        <div class="menu flex-container">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M8 9.99996C8 11.0178 8.89733 11.8461 10 11.8461C11.1027 11.8461 12 11.0178 12 9.99996C12 8.98212 11.1027 8.15381 10 8.15381C8.89733 8.15381 8 8.98212 8 9.99996Z" fill="white"/>
                <path d="M8 16.1538C8 17.1716 8.89733 17.9999 10 17.9999C11.1027 17.9999 12 17.1716 12 16.1538C12 15.1359 11.1027 14.3076 10 14.3076C8.89733 14.3076 8 15.1359 8 16.1538Z" fill="white"/>
                <path d="M8 3.84615C8 4.864 8.89733 5.69231 10 5.69231C11.1027 5.69231 12 4.864 12 3.84615C12 2.82831 11.1027 2 10 2C8.89733 2 8 2.82831 8 3.84615Z" fill="white"/>
            </svg>
        </div>
    </div>
    <!---->

    <script>
        document.getElementById('drag').addEventListener('dragstart', function() {
            event.preventDefault();
            const removeIcon = document.querySelector('.remove-icon');
            removeIcon.classList.add('visible');

            // Set a timeout to remove the visible class after 300ms
            setTimeout(() => {
                removeIcon.classList.remove('visible');
            }, 3000);
        });
    </script>
</body>
</html>
