<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <div>
      <div
        class="relative z-[99999]"
        id="headlessui-dialog-:r4:"
        role="dialog"
        aria-modal="true"
        data-headlessui-state="open"
      >
        <div class="fixed inset-0 bg-black/80"></div>
        <div class="fixed inset-0 overflow-y-auto">
          <div
            class="flex min-h-full items-center justify-center p-4 text-center"
          >
            <div
              class="w-full max-w-2xl max-h-[68dvh] transform text-left transition-all"
              id="headlessui-dialog-panel-:r5:"
              data-headlessui-state="open"
            >
              <div
                class="max-w-[600px] mx-auto rounded-lg shadow-2xl relative flex flex-col"
                data-headlessui-state=""
              >
                <div class="flex justify-between py-1">
                  <div class="flex items-center px-2 gap-2">
                    <p class="my-1 font-semibold">For quick access :</p>
                    <div
                      class="bg-[#1a1a1f] text-white text-xs font-bold px-2 py-1 rounded-md"
                    >
                      CTRL
                    </div>
                    <span>+</span>
                    <div
                      class="bg-[#1a1a1f] text-white text-xs font-bold px-2 py-1 rounded-md"
                    >
                      S
                    </div>
                  </div>
                </div>
                <div
                  class="flex items-center text-base font-medium rounded-lg bg-[#1a1a1f]"
                >
                  <input
                    class="p-4 text-white w-full bg-transparent border-0 outline-none font-sans"
                    placeholder="Search Anime..."
                    autocomplete="off"
                    id="headlessui-combobox-input-:r6:"
                    role="combobox"
                    aria-expanded="false"
                    aria-autocomplete="list"
                    data-headlessui-state=""
                    type="text"
                  />
                </div>
                <ul
                  class="bg-[#1a1a1f] rounded-xl mt-2 max-h-[50dvh] overflow-y-auto flex flex-col scrollbar-thin scrollbar-thumb-primary scrollbar-thumb-rounded"
                  role="listbox"
                  id="headlessui-combobox-options-:r7:"
                  data-headlessui-state=""
                ></ul>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
