<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .home {
            flex-direction: column;
            cursor: pointer;
        }
        .flex-container {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .home-icon {
            position: relative;
            width: 44px;
            padding: 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .home-icon svg {
            width: 20px;
            height: 20px;
            fill: #fff !important;
        }
        span.text {
            color: #000000;
            line-height: 20px;
            font-size: 12px;
            display: inline-flex;
        }
    </style>
</head>
<body>

</html>
