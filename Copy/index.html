<!DOCTYPE html>

<head dir="ltr" lang="en">
   <meta charset="UTF-8">
   <link id="pagestyle" rel="stylesheet" href="styles.css">
   <!-- Boxicons CDN Link -->
   <link href='https://unpkg.com/boxicons@2.0.7/css/boxicons.min.css' rel='stylesheet'>
   <!-- FontAwesome CDN Link-->
   <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@latest/css/font-awesome.min.css">

   <link rel="stylesheet" href="/Component/CSS/fav.css">

   <link rel="stylesheet" media="screen and (max-width: 600px)" href="small-screen.css">
    -->
   <!-- for Small Screen ... is is also possible to do this way -->
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title> Responsive Sidebar Menu</title>
   <script type="text/javascript">
      // ===== To Toggle StyleSheet ===== 

      function swapStyleSheet(sheet) {
         document.getElementsByClassName('top-nav').setAttribute('href', 'toggle style.css');
      }
   </script>

</head>

<body>
   <!-- Section: Sidebar -->
   <div class="sidebar">
      <!-- Logo -->
      <div class="logo-details">
         <img src="./assets/images/logo.png" alt="logo" />
         <div class="logo_name">Radioactive</div>
         <i class='bx bx-menu' aria-hidden="true" id="btn"></i>
      </div>
      <div class="nav-list">
         <ul>
            <!-- Serach -->
            <li class="nav-items search">
               <i class='bx bx-search' aria-hidden="true"></i>
               <input type="text" placeholder="Search..." />
               <span class="tooltip">Search</span>
            </li>
            <!-- Home -->
            <li class="nav-items home">
               <a href="#">
                  <img src="./assets/Home Icon.svg" />
                  <span class="links_name">Home</span>
               </a>
               <span class="tooltip">Home</span>
            </li>
            <!-- Drives -->
            <li class="nav-items drives">
               <a href="#">
                  <img src="./assets/Drive.svg" />
                  <span class="links_name">Drives</span>
                  <i class="fi fi-rr-caret-up" id="arrow" aria-hidden="true"></i>
               </a>
               <span class="tooltip">Drive</span>
            </li>
            <!-- View -->
            <li class="nav-items">
               <a href="#">
                  <i onclick="viewBtnChange(this)" class='bx bx-grid-alt' aria-hidden="true"></i>
                  <span class="links_name">View</span>
               </a>
               <span class="tooltip">Small</span>
            </li>
            <!-- Saved -->
            <li class="nav-items saved">
               <a href="#">
                  <i class='bx bx-heart' aria-hidden="true"></i>
                  <span class="links_name">Saved</span>
                  <i class='bx bx-info-circle' aria-hidden="true" id="infobtn"></i>
               </a>
               <span class="tooltip">Saved</span>
            </li>
            <!-- Settings -->
            <li class="nav-items settings">
               <a href="#" id="showSettingMenu">
                  <i class='bx bx-cog' aria-hidden="true"></i>
                  <span class="links_name">Settings</span>
                  <i class="fi fi-rr-caret-up" id="arrow" aria-hidden="true"></i>
               </a>
               <span class="tooltip">Settings</span>
               <ul class="setting-dropdown">
                  <div class="settings-dropdown-menu">
                     <li class="settings display">
                        <a href="#">
                           <i class="fa fa-television" aria-hidden="true"></i>
                           <span class="links_name">Display Full Name</span>
                        </a>
                     </li>
                     <li class="settings time">
                        <a href="#">
                           <i class="fa fa-calendar-times-o" aria-hidden="true"></i>
                           <span class="links_name">Hide Modified Time</span>
                        </a>
                     </li>
                     <li class="settings trash">
                        <a href="#">
                           <i class="fa fa-trash-o" aria-hidden="true"></i>
                           <span class="links_name">Clear Trash</span>
                        </a>
                     </li>
                     <li class="settings toggle">
                        <a href="#">
                           <img src="assets/toggle-on.svg" alt="" onclick="swapStyleSheet('toggle style.css')"
                              class="top-nav" />
                           <span class="links_name">Toggle Navbar</span>
                        </a>
                     </li>
                     <li class="settings bug">
                        <a href="#">
                           <i class='bx bx-bug' aria-hidden="true"></i>
                           <span class="links_name">Bugs</span>
                        </a>
                     </li>
                     <li class="settings about">
                        <a href="#">
                           <i class='bx bx-info-circle' aria-hidden="true"></i>
                           <span class="links_name">About</span>
                        </a>
                     </li>
                  </div>
               </ul>
            </li>

            <!-- Contact -->
            <li class="nav-items contact">
               <div class="contact telegram">
                  <a href="#"><img src="assets/telegram.svg" class="telegram-icon" alt="icon"></a>
               </div>
               <div class="contact discord">
                  <a href="#"><img src="assets/discord.svg" class="github-icon" alt="icon"></a>
               </div>
               <div class="contact github">
                  <a href="#"><img src="assets/github.svg" class="github-icon" alt="icon"></a>
               </div>
            </li>
         </ul>
      </div>

      <!-- BMC -->
      <!-- Credit -->
      
   </div>

      <div class="theme dark">

      </div>

   </div>
